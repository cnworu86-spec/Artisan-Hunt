kind = "mobile"
previewPath = "/"
title = "Artisan Hunt Mobile"
description = "A Ghana-focused mobile marketplace where clients discover artisans and providers manage their craft services, bookings, and work history."
version = "1.0.0"
id = "artifacts/artisan-hunt-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 21129

[services.development]
run = "pnpm --filter @workspace/artisan-hunt-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/artisan-hunt-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/artisan-hunt-mobile", "run", "serve" ]

[services.env]
PORT = "21129"
BASE_PATH = "/"
